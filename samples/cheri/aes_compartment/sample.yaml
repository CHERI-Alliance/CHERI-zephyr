sample:
  name: AES Compartment Demonstration
  description: show how to manually constuct CHERI compartments on zephyr
common:
  tags: cheri
  toolchain_allow:
    - llvm-cheri
  platform_allow:
    - qemu_riscv64cheri_zcheripurecap
    - qemu_riscv64cheri_smp_zcheripurecap
  harness: console
  harness_config:
    type: one_line
    regex:
      - "Test Complete"

tests:
  samples.cheri.aes_compartment.test1:
    extra_args: TEST_NO=1
  samples.cheri.aes_compartment.test2:
    extra_args: TEST_NO=2
  samples.cheri.aes_compartment.test3:
    extra_args: TEST_NO=3
  samples.cheri.aes_compartment.test4:
    extra_args: TEST_NO=4
  samples.cheri.aes_compartment.test5:
    extra_args: TEST_NO=5
  samples.cheri.aes_compartment.test6:
    extra_args: TEST_NO=6
