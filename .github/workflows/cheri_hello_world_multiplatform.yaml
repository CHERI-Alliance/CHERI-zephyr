name: Hello World (Multiplatform on capable-hub)


on:
  push:
    branches:
      - v*-cheri-branch
      - collab-cheri**
      - feature/0.**
      - feature/cheri**
      - feature/CHERI**
  pull_request:
    branches:
      - v*-cheri-branch
      - collab-cheri**
    paths:
      - 'scripts/**'
      - '.github/workflows/cheri_hello_world_multiplatform.yaml'
      - 'SDK_VERSION'
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu-22.04
            container: ubuntu:22.04
          - name: ubuntu-24.04
            container: ubuntu:24.04

    runs-on: the-capable-hub-aws-ci

    container:
      image: ${{ matrix.container }}

    steps:
      - name: Install system prerequisites for minimal container
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -y
          apt-get install -y \
            git \
            sudo \
            wget \
            python3 \
            python3-venv \
            python3-dev \
            python3-pip \
            cmake \
            ninja-build \
            gcc-multilib \
            g++-multilib \
            flex \
            gperf \
            pkg-config \
            libtool \
            autoconf \
            automake \
            bison \
            build-essential \
            python3-setuptools \
            python3-wheel \
            device-tree-compiler

      - name: Inspect Python
        run: |
          python3 --version || true

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: zephyr
          fetch-depth: 0

      - name: Rebase
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        working-directory: zephyr
        shell: bash
        run: |
          git config --global user.email "actions@zephyrproject.org"
          git config --global user.name "Github Actions"
          rm -fr ".git/rebase-apply"
          rm -fr ".git/rebase-merge"
          git rebase origin/${BASE_REF}
          git clean -f -d
          git log --graph --oneline HEAD...${PR_HEAD}

      - name: Set up Python venv
        run: |
          python3 -m venv .venv
          echo "$GITHUB_WORKSPACE/.venv/bin" >> $GITHUB_PATH

      - name: Setup Zephyr project
        uses: zephyrproject-rtos/action-zephyr-setup@f7b70269a8eb01f70c8e710891e4c94972a2f6b4 # v1.0.6
        with:
          app-path: zephyr
          toolchains: all

      - name: Build firmware
        working-directory: zephyr
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "macOS" ]; then
            EXTRA_TWISTER_FLAGS="-P native_sim --build-only"
          elif [ "${{ runner.os }}" = "Windows" ]; then
            EXTRA_TWISTER_FLAGS="-P native_sim --short-build-path -O/tmp/twister-out"
          fi
          ./scripts/twister --runtime-artifact-cleanup --force-color --inline-logs -T samples/hello_world -T samples/cpp/hello_world -v $EXTRA_TWISTER_FLAGS

      - name: Upload artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          if-no-files-found: ignore
          path:
            zephyr/twister-out/*/samples/hello_world/sample.basic.helloworld/build.log
            zephyr/twister-out/*/samples/cpp/hello_world/sample.cpp.helloworld/build.log
